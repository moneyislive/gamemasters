# Despliegue en Render — un único servicio sirve la web y la API.
#
# POR QUÉ RENDER Y NO VERCEL. Esto no es una web estática: el agente genera la
# trama en flujo durante minutos, las partidas en vivo se sincronizan con espera
# larga, y hay estado en memoria que asume UN SOLO proceso —el candado por
# partida de `live/sesion.ts`, los códigos de un solo uso de `routes/cuenta.ts`
# y el contador del limitador—. En un entorno sin servidor, cada invocación es
# un proceso distinto: el candado deja de serializar nada y doce móviles
# escribiendo a la vez pierden cambios, un código de un solo uso vale dos veces,
# y el límite de intentos se multiplica por el número de instancias. Ninguna de
# las tres cosas da error: siguen «funcionando» y fallan en silencio.
#
# Render lee este fichero al conectar el repositorio (Blueprint). Las claves
# marcadas con sync:false NO se guardan aquí: las introduces tú en el panel,
# para que no acaben nunca en el repositorio.
services:
  - type: web
    name: harkania
    runtime: node
    plan: starter # de pago, y por el disco: ver abajo
    region: frankfurt # el más cercano a España
    # `--include=dev` NO ES OPCIONAL, y su ausencia da un error que no se
    # explica solo: «esbuild: not found».
    #
    # Aquí abajo se define NODE_ENV=production, y npm respeta esa variable
    # OMITIENDO las dependencias de desarrollo al instalar. Pero esbuild (que
    # compila el servidor) y vite (que compila el cliente) son justamente
    # dependencias de desarrollo: solo hacen falta para construir, no para
    # ejecutar. Sin esta bandera, la instalación termina bien, el build arranca,
    # y muere buscando una herramienta que nadie instaló.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud

    # EL DISCO PERSISTENTE, Y POR QUÉ NO BASTA CON PAGAR EL PLAN.
    #
    # Estar en un plan de pago NO da persistencia por sí solo: hace falta
    # declarar el disco aquí. Sin este bloque, el sistema de ficheros del
    # contenedor es efímero y desaparece en cada despliegue — y con él las fotos
    # de los invitados y los avatares 3D generados con Tripo, que se escriben en
    # `UPLOADS_DIR`.
    #
    # No dan error al desaparecer: las partidas siguen ahí y los retratos salen
    # rotos, o la portada de la app se queda sin figura. Un fallo silencioso,
    # días después, sin relación aparente con nada. Ya pasó una vez.
    disk:
      name: harkania-uploads
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: '20'
      # De esta variable cuelgan seis comportamientos, entre ellos que el taller
      # se cierre si falta la contraseña y que el servidor NO caiga al fichero
      # JSON local si Atlas parpadea (lo cual mostraría un taller vacío y haría
      # rehacer partidas que existen).
      - key: NODE_ENV
        value: production

      # El origen público. El servidor se niega a arrancar sin él en producción:
      # con él se fabrica la dirección de vuelta que se le da a Google —que exige
      # coincidencia carácter por carácter— y de él cuelga el flag `secure` de
      # las cookies. Cámbialo al dominio propio cuando lo apuntes aquí.
      - key: PUBLIC_ORIGIN
        value: https://harkania.onrender.com

      # Render enruta al puerto que le digas y el proceso vive en su propia red:
      # aquí NO se ata al bucle local como en una máquina con nginx delante, o
      # el enrutador no llegaría.
      - key: HOST
        value: 0.0.0.0

      # Apunta DENTRO del disco montado arriba. Sin esta variable, el disco
      # está montado y nadie escribe en él: las subidas irían al sistema de
      # ficheros efímero exactamente igual que sin disco.
      - key: UPLOADS_DIR
        value: /var/data/uploads

      - key: ANTHROPIC_MODEL
        value: claude-fable-5
      - key: MONGODB_DB
        value: harkania

      # --- Secretos: se introducen en el panel (Environment) ------------------
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: APP_PASSWORD
        sync: false
      # QUIEN HAY DELANTE, para que el limitador sepa de quien es la
      # `X-Forwarded-For`. Aqui hay un balanceador externo, asi que el otro
      # extremo del TCP es SIEMPRE suyo: sin esto, todas las peticiones de la
      # plataforma entran con la misma direccion y ocho contrasenas mal
      # tecleadas por cualquiera dejan a TODOS los Game Masters fuera del
      # taller. El valor por defecto (`loopback`) es el seguro para el
      # despliegue de casa, donde el portatil escucha en 0.0.0.0 y la cabecera
      # la escribe quien quiere. Ver `server/src/puerta/limitador.ts`.
      - key: PROXY_DE_CONFIANZA
        value: plataforma
      # Firma las cookies, los pasaportes y las credenciales de jugador.
      # Cambiarlo invalida TODAS las sesiones a la vez: se elige una vez.
      - key: PLAYER_TOKEN_SECRET
        sync: false

      # --- El freno de lo que cuesta dinero ----------------------------------
      # Tope diario por identidad. Habia uno, y estaba puesto en la ruta BARATA
      # (avatares y fondos); las caras no llevaban ninguno, y generar una trama
      # cuesta entre 0,48 y 0,82 euros MEDIDOS cada vez.
      #
      # Estan holgados a proposito: su trabajo es cortar un bucle, no racionar
      # el producto. Quien dirige de verdad genera una vez, actualiza dos o tres
      # y quiza regenera; ocho al dia le sobran y son unos seis euros de techo.
      #
      # Un 0 QUITA el tope de esa familia, y es una salida de emergencia de
      # verdad: si resulta estar mal calibrado un sabado por la noche, se pone a
      # 0 y se recalibra el lunes, en vez de dejar a doce personas sentadas a la
      # mesa. Ver `server/src/gasto/tope.ts`.
      - key: TOPE_DIARIO_TRAMAS
        value: "8"
      - key: TOPE_DIARIO_CHARLA
        value: "250"
      - key: TOPE_DIARIO_ESTUDIO
        value: "8"

      # --- Identidad, cuando la tengas ---------------------------------------
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: APPLE_CLIENT_IDS
        sync: false
      # Sin tu correo aquí, tu propia cuenta de Google no abre el taller.
      - key: GM_ADMITIDOS
        sync: false

      # --- La descarga del APK, mientras no haya tienda -----------------------
      # La dirección del fichero en GitHub Releases y la versión que anuncia la
      # página. Sin la primera, /descargar lo dice en vez de enseñar un botón
      # muerto. Ver `enlaces/descarga.ts`.
      # Basta con la version: la direccion se deduce de ella. Ver
      # `enlaces/descarga.ts` y el bloque de .env.example.
      - key: APK_VERSION
        sync: false
      - key: APK_REPO
        sync: false
      # Solo para saltarse el patron. Normalmente vacia.
      - key: APK_URL
        sync: false

      # --- Generación de imagen y 3D (opcionales) ----------------------------
      - key: TRIPO_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # --- Datos del responsable, para el aviso legal -------------------------
      - key: LEGAL_NIF
        sync: false
      - key: LEGAL_DIRECCION
        sync: false
