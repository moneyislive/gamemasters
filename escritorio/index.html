<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      `width=device-width`, y `viewport-fit=cover` para pintar hasta los bordes.

      Hasta el 27-sep-2026 aquí ponía `width=1024`: la Sala era «el cliente de PC» y el
      móvil iba por /jugar. Pero la Sala se abre desde el teléfono —un enlace pasado por
      un chat lleva aquí—, y con 1024 el teléfono la pintaba como un monitor y la encogía
      a un tercio: la palanca de 128 px pensada para el pulgar se quedaba en 45, y los
      textos no se leían. Miguel lo vio jugando y pidió que se juegue bien en el móvil
      también desde /sala. Cada pantalla reparte su sitio con el ancho de verdad.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sala de Arcade</title>
    <meta name="theme-color" content="#06110f" />
    <!--
      LA PANTALLA COMPLETA DONDE NO HAY API (`docs/PANTALLAS.md` §5). En el iPhone una página no
      puede pedir la pantalla completa: la da añadirla a la pantalla de inicio, y para eso están el
      manifiesto (`display: fullscreen`, orientación libre) y las metas de aplicación web de Apple,
      con la barra de estado translúcida para que el tablero llegue hasta arriba —las zonas seguras
      las respeta `estilo.css` con `env(safe-area-inset-*)`—. En Android el botón de las pantallas
      de juego (`src/pantalla-completa.tsx`) hace lo mismo sin instalar nada.

      Las rutas van desde la raíz y Vite les antepone la base (`/sala/`), en desarrollo y al
      empaquetar: los ficheros de `public/` se sirven bajo ella, y el servidor los da con su tipo
      (`express.static` conoce `.webmanifest`). Con `%BASE_URL%` saldría `/sala/sala/`.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icono-1024.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sala" />
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
