      NADA DE `width=device-width` AQUÍ, y no es un descuido copiado a medias del
      taller: esto es un cliente de PC. La app de móvil ya existe en /jugar y se
      queda como está; lo que falta es una pantalla pensada para un monitor y un

      pantalla escalada no salga con todo diminuto.
    -->
    <meta name="viewport" content="width=1024, initial-scale=1.0" />
