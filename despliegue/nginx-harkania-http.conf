# PASO 1 DE 2 — nginx SIN cifrado, solo para que certbot pueda emitir el
# certificado.
#
# POR QUÉ HAY DOS FICHEROS Y NO UNO. El definitivo (nginx-harkania.conf) declara
# rutas a un certificado que todavía no existe, y nginx se niega a arrancar si no
# lo encuentra: «cannot load certificate ... No such file or directory». Y
# certbot, a su vez, necesita un nginx en pie que responda por el puerto 80 para
# superar el reto. Con un solo fichero eso es un callejón sin salida, y se
# descubre a las once de la noche.
#
# Este se pone primero, se emite el certificado, y luego se sustituye por el otro.

server {
    listen 80;
    listen [::]:80;
    server_name harkania.com www.harkania.com;

    # El reto de Let's Encrypt se sirve DESDE DISCO, sin pasar por la aplicación:
    # así funciona aunque el servicio esté parado, que es justo el caso el primer
    # día. La carpeta la crea el LEEME.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
