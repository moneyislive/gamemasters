# PASO 2 DE 2 — el definitivo, con cifrado.
#
# Se pone DESPUÉS de que certbot haya emitido el certificado. Antes, nginx no
# arranca: las rutas de abajo apuntan a ficheros que aún no existen.

server {
    listen 80;
    listen [::]:80;
    server_name harkania.com www.harkania.com;

    # El reto de renovación sigue teniendo que funcionar por el puerto 80: el
    # certificado dura noventa días y se renueva solo.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://harkania.com$request_uri;
    }
}

# www a secas, para que no haya dos direcciones vivas. Un dominio con dos formas
# de escribirse parte las cookies en dos y deja media sesión en cada sitio.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.harkania.com;

    ssl_certificate     /etc/letsencrypt/live/harkania.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harkania.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://harkania.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name harkania.com;

    ssl_certificate     /etc/letsencrypt/live/harkania.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harkania.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Un año, y con «always» para que salga también en las respuestas de error.
    # Sin «always», un 502 sale sin la cabecera, que es justo cuando alguien
    # recarga a mano y podría acabar en HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Las fotos de los invitados y los dosieres pueden ser grandes; el estudio de
    # avatares manda imágenes en base64. El servidor tiene su propio límite.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;

        # LAS CUATRO LÍNEAS QUE NO SE PUEDEN OLVIDAR, y qué se rompe sin cada una:
        #
        #   Host              — el servidor no sabe cómo se llega a él.
        #   X-Real-IP         — el limitador de intentos ve una sola IP: la de
        #                       nginx. Un fallo de alguien bloquea a la casa entera.
        #   X-Forwarded-For   — igual, y además se pierde el rastro en el registro.
        #   X-Forwarded-Proto — `req.secure` es falso, y con él el flag «secure»
        #                       de las cookies si no hubiera PUBLIC_ORIGIN.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los flujos en directo (la generación de la trama, el chat del
        # mayordomo) tardan minutos y llegan por goteo. Con los valores por
        # defecto de nginx, la conexión se corta a los sesenta segundos a mitad
        # de generar el caso, y el búfer retiene el goteo hasta el final — que es
        # como no tener goteo.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
